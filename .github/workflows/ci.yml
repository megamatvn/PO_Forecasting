name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPERPOWERS_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm check:secrets

      - name: Start isolated Supabase
        run: pnpm supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit

      - name: Configure app for local Supabase
        shell: bash
        run: |
          pnpm supabase status -o env > .supabase-env
          grep '^API_URL=' .supabase-env | sed 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/' > .env.local
          grep '^ANON_KEY=' .supabase-env | sed 's/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/' >> .env.local
          grep '^DB_URL=' .supabase-env | sed 's/^DB_URL=/SUPABASE_DB_URL=/' >> .env.local

      - run: pnpm test:db:local
      - run: pnpm build
      - run: pnpm check:secrets
      - run: pnpm verify:production-harness
      - run: pnpm e2e:local

      - name: Stop Supabase
        if: always()
        run: pnpm supabase stop --no-backup
